# Perfil de produção. Selecione com SPRING_PROFILES_ACTIVE=prod (o compose.prod.yaml já fixa esse valor).
# Parte do application.yaml: aqui só ficam as diferenças de segurança. Nada de ferramentas de desenvolvimento.

logging:
  level:
    root: INFO
    br.com.nexora: INFO

# Contrato OpenAPI e Swagger UI nunca são servidos em produção (explícito, não só herdado do padrão).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  # Encerramento gracioso no "docker stop" (termina requisições em andamento antes de sair).
  shutdown: graceful
  error:
    # Respostas de erro nunca carregam stack trace, mensagem de exceção nem detalhes de binding.
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

spring:
  jpa:
    show-sql: false
  datasource:
    hikari:
      # Instância única numa VPS pequena (~4 GB): pool enxuto, abaixo do max_connections do PostgreSQL.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
