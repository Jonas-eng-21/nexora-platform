# Perfil de produção. Selecione com SPRING_PROFILES_ACTIVE=prod (o compose.prod.yaml já fixa esse valor).
# Parte do application.yaml: aqui só ficam as diferenças de segurança. Nada de ferramentas de desenvolvimento.

logging:
  level:
    root: INFO
    br.com.nexora: INFO

# Contrato OpenAPI e Swagger UI nunca são servidos em produção (explícito, não só herdado do padrão).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  error:
    # Respostas de erro nunca carregam stack trace, mensagem de exceção nem detalhes de binding.
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

spring:
  jpa:
    show-sql: false
