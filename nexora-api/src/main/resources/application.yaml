spring:
  application:
    name: nexora-api
  # Datasource vem de SPRING_DATASOURCE_* (definido no compose.yaml).
  jpa:
    hibernate:
      ddl-auto: validate   # esquema controlado pelo Flyway
    open-in-view: false
    properties:
      hibernate:
        # Carrega coleções e associações preguiçosas em lotes, evitando uma consulta por linha (N+1) nas listagens.
        default_batch_fetch_size: 50
  flyway:
    enabled: true
  servlet:
    multipart:
      # Currículo em PDF: 5 MiB (5.242.880 bytes). O servidor confere o limite também no serviço.
      max-file-size: 5MB
      max-request-size: 6MB

# Documentação OpenAPI desligada por padrão; habilitada apenas no perfil dev.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

nexora:
  # Administrador inicial: criado na subida se ambos estiverem definidos e a conta ainda não existir.
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  matching:
    # Pesos dos critérios do score, em pontos percentuais (devem somar 100).
    # São hipóteses de implementação, não valores validados cientificamente.
    weights:
      required-skills: 45
      desired-skills: 20
      interests: 20
      work-model-and-location: 15
    # Matching semântico (embeddings do Gemini) combinado ao score estruturado. Desligado por padrão: sem a flag,
    # o matching estruturado funciona sozinho e a aplicação sobe sem chave. A chave (GEMINI_API_KEY) é lida só
    # pelo provedor e nunca vai para propriedades, logs ou respostas.
    semantic:
      enabled: ${GEMINI_MATCHING_ENABLED:false}
      model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
      dimensions: ${GEMINI_EMBEDDING_DIMENSIONS:768}
      # Peso do score semântico no híbrido (pontos percentuais): híbrido = 80% estruturado + 20% semântico.
      # Hipótese técnica a validar, não resultado científico.
      semantic-weight: 20
      timeout: 10s
      max-attempts: 2
      retry-backoff: 500ms
      # Teto de textos novos enviados ao provedor por requisição de recomendação (o resto sai como fallback).
      max-new-embeddings-per-request: 100
      # Textos maiores que isto são cortados antes do envio.
      max-text-length: 4000
  storage:
    # Pasta privada dos PDFs de candidatura. No Docker é um volume nomeado montado só no backend;
    # nunca servida como recurso estático. Precisa ser durável (volume persistente ou storage privado).
    resumes-dir: ${RESUMES_STORAGE_DIR:/data/resumes}
  security:
    jwt:
      # Segredo HMAC (HS256), mínimo de 32 caracteres. Obrigatório: sem valor padrão de propósito.
      secret: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION:60m}
