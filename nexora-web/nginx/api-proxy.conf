# Parâmetros comuns do proxy para a API. O URI original (/api/v1/..., query string, método, corpo e o cabeçalho
# Authorization: Bearer) segue intacto até o backend (proxy_pass sem URI).
# Variável + resolver do Docker: o nome "backend" é resolvido de novo (TTL curto), então recriar só o backend não
# deixa o proxy com IP antigo.
set $backend_upstream http://backend:8080;
proxy_pass $backend_upstream;
proxy_http_version 1.1;
proxy_set_header Host $host;
# O backend só enxerga o proxy. Estes cabeçalhos SUBSTITUEM qualquer valor enviado pelo cliente (não há "$proxy_add_x_forwarded_for"):
# um X-Forwarded-For forjado nunca chega ao backend.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";
proxy_read_timeout 60s;
proxy_send_timeout 60s;
# O backend já envia estes dois; o servidor define os seus em nível de server (evita duplicata).
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
# Falha de conexão com o backend vira JSON, nunca HTML.
error_page 502 503 504 = @api_unavailable;
# error_page não é herdado quando o bloco define o seu: repetimos o 413 e o 429 aqui.
error_page 413 = @too_large;
error_page 429 = @too_many_requests;
