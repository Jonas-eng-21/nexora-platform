# Headers de defesa em profundidade. Incluído em todo bloco que usa add_header (o nginx não herda add_header
# de um nível superior quando o bloco define o seu próprio).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# HSTS fica DESLIGADO de propósito: só habilite depois que o domínio responder HTTPS válido de forma estável.
# Quando for o caso, descomente (sem includeSubDomains/preload até a política de domínio estar verificada):
# add_header Strict-Transport-Security "max-age=300" always;
# CSP forte exige ajustes no frontend (script inline do tema em index.html): item 9 do plano de remediação.
