# Stack de PRODUÇÃO (independente do compose.yaml, que continua sendo o de desenvolvimento).
#
#   docker compose -f compose.prod.yaml --env-file .env.prod up -d --build
#
# Somente o proxy (serviço "web") publica portas no host (80 redireciona/serve o desafio ACME; 443 serve a UI e /api/).
# Backend e PostgreSQL ficam só na rede interna do Compose. Nenhum override de desenvolvimento se aplica aqui.
# Modelo das variáveis: .env.prod.example. Guia completo: docs/DEPLOY_HOSTINGER_UBUNTU.md.
# Nunca remova os volumes (a opção -v do "down"): postgres_data e resumes_data são os dados do sistema.
name: nexora-prod

x-logging: &default-logging
  # Rotação dos logs do Docker: sem isso o disco da VPS enche com o tempo.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${POSTGRES_MEM_LIMIT:-768m}
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    # Dimensionado para uma VPS pequena (~4 GB, instância única): poucas conexões e memória compartilhada moderada.
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-40}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-192MB}
    volumes:
      # PostgreSQL 18+: a imagem usa /var/lib/postgresql (PGDATA versionado).
      - postgres_data:/var/lib/postgresql
    # Sem "ports": só a rede interna do Compose alcança o 5432.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./nexora-api
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${BACKEND_MEM_LIMIT:-1g}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Fixo de propósito: um .env de desenvolvimento (SPRING_PROFILES_ACTIVE=dev) não pode ligar o Swagger aqui.
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET (mínimo 32 caracteres)}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-60m}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Heap limitado dentro do mem_limit do container (o resto é metaspace, threads e buffers) e saída em caso de OOM
      # (a política de restart sobe de novo, em vez de ficar meio vivo).
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError"
      # Matching semântico desligado por padrão; produção não depende do Gemini.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      GEMINI_EMBEDDING_DIMENSIONS: ${GEMINI_EMBEDDING_DIMENSIONS:-768}
      GEMINI_MATCHING_ENABLED: ${GEMINI_MATCHING_ENABLED:-false}
    volumes:
      # PDFs de candidatura: volume nomeado, montado só no backend e fora de qualquer rota pública.
      - resumes_data:/data/resumes
    # Sem "ports": 8080 (API) e 8081 (health) só são alcançáveis pela rede interna (a API, pelo serviço web).
    expose:
      - "8080"
    healthcheck:
      # Porta de gerenciamento (8081): só /actuator/health, sem detalhes; nunca encaminhada pelo proxy.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/actuator/health/readiness | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s

  web:
    build:
      context: ./nexora-web
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${WEB_MEM_LIMIT:-128m}
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXORA_DOMAIN: ${DOMAIN:?defina DOMAIN (domínio público, sem https://)}
      # Vazio = sem HSTS. Habilite só depois de confirmar o HTTPS real (ver guia de deploy).
      NEXORA_HSTS: ${HSTS_VALUE:-}
      # Limite de tentativas de login/cadastro por IP (rajada de 20 além da taxa).
      NEXORA_AUTH_RATE: ${AUTH_RATE_LIMIT:-20r/m}
    ports:
      # WEB_BIND_ADDRESS=127.0.0.1 serve para testar localmente sem expor na rede.
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      # Diretório do host com fullchain.pem e privkey.pem (somente leitura). Nunca versionar nem copiar para a imagem.
      # Vazio no primeiro boot: o Nginx sobe com certificado temporário até a emissão do real.
      - ${TLS_CERT_DIR:?defina TLS_CERT_DIR (diretório absoluto do host para fullchain.pem e privkey.pem)}:/etc/nginx/certs:ro
      # Desafio HTTP-01 do Let's Encrypt (escrito pelo serviço certbot).
      - acme_webroot:/var/www/certbot:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O /dev/null https://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Emissão/renovação de certificados (Let's Encrypt). Não sobe com "up": é executado sob demanda pelos
  # scripts scripts/prod/tls-issue.sh e tls-renew.sh (profile "tools").
  certbot:
    image: certbot/certbot:v4.0.0
    profiles: ["tools"]
    volumes:
      - letsencrypt_state:/etc/letsencrypt
      - acme_webroot:/var/www/certbot
      # Destino dos certificados lidos pelo Nginx (o deploy-hook copia para cá).
      - ${TLS_CERT_DIR:?defina TLS_CERT_DIR}:/tls

volumes:
  postgres_data:
  resumes_data:
  acme_webroot:
  letsencrypt_state:
